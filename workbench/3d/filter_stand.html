<!doctype html>
<meta charset="utf-8">
<title>FILTER4 render stand</title>
<style>
 body{margin:0;background:#14161a;display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
 figure{margin:0;position:relative;height:480px;background:#181a1f}
 canvas{width:100%;height:100%;display:block}
 figcaption{position:absolute;left:10px;top:8px;color:#9fb2c4;font:600 15px sans-serif}
</style>
<figure><canvas id="c1"></canvas><figcaption>изо</figcaption></figure>
<figure><canvas id="c2"></canvas><figcaption>спереди</figcaption></figure>
<figure><canvas id="c3"></canvas><figcaption>сбоку</figcaption></figure>
<figure><canvas id="c4"></canvas><figcaption>сверху</figcaption></figure>
<figure><canvas id="c5"></canvas><figcaption>снизу</figcaption></figure>
<figure><canvas id="c6"></canvas><figcaption>крупный план</figcaption></figure>
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script src="../../assets/site/spiderfarmer-3d.js"></script>
<script>
const views = [
  {id:'c1', pos:[520,430,520], look:[0,0,0]},
  {id:'c2', pos:[0,60,760],    look:[0,0,0]},
  {id:'c3', pos:[760,40,40],   look:[0,0,0]},
  {id:'c4', pos:[0,780,60],    look:[0,0,0]},
  {id:'c5', pos:[0,-780,60],   look:[0,0,0]},
  {id:'c6', pos:[330,180,330], look:[0,60,110]}
];
for (const v of views){
  const cv = document.getElementById(v.id);
  const w = cv.clientWidth || 480, h = cv.clientHeight || 480;
  cv.width = w*2; cv.height = h*2;
  const renderer = new THREE.WebGLRenderer({canvas:cv, antialias:true});
  renderer.setPixelRatio(1);
  renderer.outputEncoding = THREE.sRGBEncoding;
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x181a1f);
  scene.add(new THREE.HemisphereLight(0xcfe4ee, 0x0c1113, 1.0));
  const key = new THREE.DirectionalLight(0xffffff, 1.2); key.position.set(400,600,500); scene.add(key);
  const fill = new THREE.DirectionalLight(0x86b6ff, 0.5); fill.position.set(-500,200,300); scene.add(fill);
  const rim = new THREE.DirectionalLight(0xbfe6ff, 0.5); rim.position.set(0,300,-600); scene.add(rim);
  const g = SPIDERFARMER3D.build(THREE, 'FILTER4');
  scene.add(g);
  const camera = new THREE.PerspectiveCamera(34, w/h, 1, 5000);
  camera.position.set(...v.pos);
  camera.lookAt(...v.look);
  renderer.render(scene, camera);
}
document.title = 'FILTER4 stand ready';
</script>
