name: Deploy GrBox + WALLFORM sites

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      # Собираем публичное дерево целиком:
      #   /            → гроубокс-сайт SECRET BOX (как раньше)
      #   /panels-site/ → новый сайт WALLFORM
      # В артефакт не попадают .git, .github и архив переписок chats/.
      - name: Assemble full site
        run: |
          mkdir -p _site
          rsync -a --exclude='.git' --exclude='.github' --exclude='chats' ./ _site/

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
